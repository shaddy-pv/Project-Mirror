name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── STEP 1, 2, 3: INSTALL, ESLINT, TYPESCRIPT ──────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

  # ─── STEP 4: BUILD ALL 6 WORKSPACES ─────────────────────────────────────────
  build:
    name: Build (${{ matrix.workspace }})
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        workspace:
          - apps/web
          - apps/api
          - apps/panels/admin
          - apps/panels/educator
          - apps/panels/hr
          - apps/panels/sales
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Workspace
        run: npm run build --workspace=${{ matrix.workspace }}
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          MONGODB_URI: "mongodb://127.0.0.1:27017/ci_build"

  # ─── STEP 5: RUN EXISTING 9 E2E TESTS ───────────────────────────────────────
  e2e:
    name: E2E Tests (9 Critical User Journeys)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Start MongoDB Service
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: "7.0"

      - name: Install Dependencies
        run: npm ci

      - name: Start Backend API Service
        run: |
          npm run dev:api &
          npx wait-on -t 30000 http://127.0.0.1:5000/api/public/stats
        env:
          PORT: 5000
          MONGODB_URI: "mongodb://127.0.0.1:27017/enginow_e2e_ci"
          STAFF_JWT_SECRET: "ci_safe_test_jwt_secret_key_2026"

      - name: Start Web Application Service
        run: |
          npm run dev:web &
          npx wait-on -t 45000 http://localhost:3000

      - name: Run Existing 9-Flow E2E Test Suite
        run: npm run test:e2e
        env:
          WEB_URL: "http://localhost:3000"
          API_URL: "http://127.0.0.1:5000/api"
