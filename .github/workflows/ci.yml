name: Enterprise CI Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. STATIC ANALYSIS, LINTING & SECRET SCANNING
  # ──────────────────────────────────────────────────────────────────────────
  code-quality-and-security:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Cache npm Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Across Workspaces
        run: npm run lint

      - name: Run Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high --production
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────────
  # 2. STRICT MONOREPO MATRIX BUILD (ALL 6 WORKSPACES)
  # ──────────────────────────────────────────────────────────────────────────
  build-matrix:
    name: Build (${{ matrix.name }})
    needs: code-quality-and-security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Backend API"
            workspace: "apps/api"
          - name: "Main Website (Next.js 16)"
            workspace: "apps/web"
          - name: "Admin Panel"
            workspace: "apps/panels/admin"
          - name: "Educator Panel"
            workspace: "apps/panels/educator"
          - name: "HR Panel"
            workspace: "apps/panels/hr"
          - name: "Sales Panel"
            workspace: "apps/panels/sales"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Next.js specific build cache for faster CI runs
      - name: Cache Next.js Build
        if: matrix.workspace == 'apps/web'
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('apps/web/**.[jt]s', 'apps/web/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Compile & Build Workspace
        run: npm run build --workspace=${{ matrix.workspace }}
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          MONGODB_URI: "mongodb://127.0.0.1:27017/ci_build"

  # ──────────────────────────────────────────────────────────────────────────
  # 3. REAL SERVICE E2E INTEGRATION & REGRESSION SUITE
  # ──────────────────────────────────────────────────────────────────────────
  e2e-integration-suite:
    name: 9-Flow E2E Integration Suite
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Spin Up Dedicated MongoDB 7.0 Service Container
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: "7.0"

      - name: Install Dependencies
        run: npm ci

      - name: Start Backend API Service
        run: |
          npm run dev:api &
          npx wait-on -t 30000 http://127.0.0.1:5000/api/public/stats
        env:
          PORT: 5000
          MONGODB_URI: "mongodb://127.0.0.1:27017/enginow_e2e_ci"
          STAFF_JWT_SECRET: "ci_testing_super_secret_jwt_key_2026"

      - name: Start Web App Service
        run: |
          npm run dev:web &
          npx wait-on -t 45000 http://localhost:3000

      - name: Execute 9-Flow End-to-End Suite
        run: npm run test:e2e
        env:
          WEB_URL: "http://localhost:3000"
          API_URL: "http://127.0.0.1:5000/api"

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: |
            apps/api/.log
            apps/web/.next
          retention-days: 7
